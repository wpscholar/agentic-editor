version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR a week for everything that should not break anything.
      minor-and-patch:
        update-types: [ minor, patch ]
    ignore:
      # WordPress ships React 18.3 and the build uses its copy, so React and
      # its types must stay on 18 until WordPress moves.
      - dependency-name: react
        update-types: [ 'version-update:semver-major' ]
      - dependency-name: react-dom
        update-types: [ 'version-update:semver-major' ]
      - dependency-name: '@types/react'
        update-types: [ 'version-update:semver-major' ]
      - dependency-name: '@types/react-dom'
        update-types: [ 'version-update:semver-major' ]
      # typescript-eslint needs the JavaScript compiler API, which TypeScript 7
      # dropped; `typescript-native` is the TypeScript 7 used for typechecking.
      - dependency-name: typescript
        update-types: [ 'version-update:semver-major' ]

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [ minor, patch ]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
